<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../web/tokens.css"><script src="../web/ax-fx.js"></script>
<title>Motion touches</title><style>body{margin:0;padding:60px;display:grid;grid-template-columns:repeat(4,max-content);gap:60px 50px;align-items:center}</style></head>
<body class="ax">
<button class="ax-btn primary" data-fx="sparks">Start run</button>
<button class="ax-btn primary" data-fx="ripple">Connect</button>
<button class="ax-btn primary" data-fx="orbit">Record</button>
<button class="ax-btn" data-busy="Homing">Home</button>
<span><span class="ax-spin"></span> <span class="ax-spin lg"></span></span>
<span class="ax-status live">Live</span>
<!-- Hover any orange button. The script below fires each effect once on load. -->
<script>setTimeout(()=>document.querySelectorAll('[data-fx]').forEach(b=>b.dispatchEvent(new MouseEvent('mouseenter'))),300)</script>
</body></html>
